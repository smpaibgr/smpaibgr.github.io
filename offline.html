<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>SIPaKDE — Koneksi Terputus</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: linear-gradient(160deg, #064e3b 0%, #0f172a 100%);
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        color: #f8fafc;
        text-align: center;
      }
      .card {
        width: 100%;
        max-width: 380px;
        background: rgba(15, 23, 42, 0.88);
        border: 1px solid rgba(52, 211, 153, 0.25);
        border-radius: 24px;
        padding: 32px 24px;
        box-shadow: 0 24px 48px rgba(0, 0, 0, 0.45);
      }
      .badge {
        width: 64px;
        height: 64px;
        margin: 0 auto 16px;
        border-radius: 18px;
        background: #059669;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 30px;
        font-weight: 900;
        color: #ffffff;
        box-shadow: 0 10px 25px rgba(5, 150, 105, 0.45);
      }
      h1 {
        margin: 0 0 8px;
        font-size: 20px;
        font-weight: 800;
      }
      p {
        margin: 0 0 24px;
        font-size: 13.5px;
        line-height: 1.6;
        color: #cbd5e1;
      }
      button {
        width: 100%;
        padding: 13px 18px;
        border: none;
        border-radius: 14px;
        background: #10b981;
        color: #022c22;
        font-size: 14px;
        font-weight: 800;
        cursor: pointer;
      }
      button:active {
        transform: scale(0.98);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="badge">S</div>
      <h1>Tidak Ada Koneksi Internet</h1>
      <p>
        Aplikasi <strong>SIPaKDE</strong> membutuhkan koneksi internet untuk memuat data terbaru.
        Pastikan Wi-Fi atau data seluler aktif, lalu ketuk tombol di bawah.
      </p>
      <button type="button" onclick="window.location.href='https://smpaibgr.github.io'">
        Coba Muat Ulang
      </button>
    </div>
  </body>
</html>
